services:
  app:
    # The root Dockerfile: dashboard at /, API at /api, one origin.
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Optional: a fresh clone has no backend/.env, and replay needs none.
      - path: ./backend/.env
        required: false
    environment:
      # Set here so it wins over a DATA_MODE or TEST_MODE left in backend/.env.
      DATA_MODE: ${DATA_MODE:-replay}
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim ships no curl; use the interpreter that is already here
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
